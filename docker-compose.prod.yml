version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: doc-extract-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: doc_extract
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - doc-extract-network

  redis:
    image: redis:7-alpine
    container_name: doc-extract-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - doc-extract-network

  api:
    image: sirajk78620/doc-extract-api:latest
    container_name: doc-extract-api
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/doc_extract
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - VISION_MODEL=llama3.2:latest
      - STRUCT_MODEL=llama3.2:latest
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - doc-extract-network
    restart: unless-stopped

  web:
    image: sirajk78620/doc-extract-web:latest
    container_name: doc-extract-web
    ports:
      - "4200:80"
    depends_on:
      - api
    networks:
      - doc-extract-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  doc-extract-network:
    driver: bridge
